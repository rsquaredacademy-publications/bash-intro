project:
  type: book
  output-dir: docs
  pre-render: "Rscript scripts/reset-fixture.R"
  resources:
    - "_redirects"
    - "404.html"
    - "robots.txt"
    - "site-kit"

quarto-required: ">=1.6.0"

sitemap: true

book:
  title: "Command Line Basics for R Users"
  author: "Aravind Hebbali"
  date: last-modified
  chapters:
    - index.qmd
    - about-the-author.qmd
    - introduction-to-command-line.qmd
    - navigating-files-and-directories.qmd
    - command-line-file-management.qmd
    - command-line-input-output.qmd
    - command-line-regular-expression.qmd
    - command-line-data-transfer.qmd
    - sudo-command.qmd
    - command-line-file-compression.qmd
    - command-line-sysinfo.qmd
    - r-command-line.qmd
    - pipes-and-redirection.qmd
    - conclusion.qmd
    - cheatsheet.qmd
    - git-appendix.qmd
  downloads: [pdf, epub]
  page-footer:
    center: |
      We use Google Analytics 4 to understand how people use this site (pages visited, referring sites, device type and approximate location) so we can improve our free learning material. Google Analytics uses cookies and a pseudonymous identifier; we don't use it for advertising and we never send Google names or email addresses. Visitors in the European Economic Area, the United Kingdom and Switzerland are asked for consent first, and if they decline, no analytics cookies are stored. Anyone can switch analytics off at any time: <a href="#" data-rsa-analytics-optout>Turn off analytics</a>.

      Sites that show the newsletter sign-up form use Zoho Campaigns to send updates. If you sign up, we collect your email address, an optional first name, and which site you signed up on, and we use them only to send you updates. Sign-up uses double opt-in, so you must confirm by email before you are added; every email includes an unsubscribe link, and we never sell or share the list.

website:
  site-url: https://bash-intro.rsquaredacademy.com
  title: "Command Line Basics for R Users"
  description: "A gentle introduction to the command line for R users."
  open-graph: true
  twitter-card: true
  navbar:
    right:
      - text: "GitHub"
        href: https://github.com/rsquaredacademy-publications/bash-intro

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    search: true
    code-overflow: wrap
    filters:
      - includes/rsa-signup.lua
    include-in-header:
      - includes/site-kit-head.html
  pdf:
    documentclass: scrreprt
    papersize: us-letter
    pdf-engine: typst
    keep-typ: false
    code-overflow: wrap
    mainfont: "Linux Libertine"
    monofont: "DejaVu Sans Mono"
    toc: true
    number-sections: true
  epub:
    toc-depth: 2
    epub-chapter-level: 1
    cover-image: img/ebook-bash-intro.png
